name: Feature request
description: Suggest a change to the plugin.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult or unsupported? Include an example request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behaviour you would like.
    validations:
      required: true
