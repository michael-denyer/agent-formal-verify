name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install prek
        run: |
          python3 -m venv "$RUNNER_TEMP/prek"
          "$RUNNER_TEMP/prek/bin/pip" install -r .github/requirements.txt
      - name: Validate repository
        run: '"$RUNNER_TEMP/prek/bin/prek" run --all-files'

  skills-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
        working-directory: .github/skills-cli
      - run: .github/skills-cli/node_modules/.bin/skills add ./skills --skill '*' --agent codex --yes --copy
      - run: diff -qr skills .agents/skills

  models:
    name: Example models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: skills/formal-verify/examples/lean-template
      - name: Fetch the pinned TLC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.cache/tla"
          gh release download v1.7.4 --repo tlaplus/tlaplus --pattern tla2tools.jar --output "$HOME/.cache/tla/tla2tools-v1.7.4.jar"
      - name: Check the examples and their mutations with TLC and Lean
        run: bash tests/models.sh

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local links and heading anchors
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --no-progress --include-fragments \
            --exclude-path .git --exclude-path .agents/skills \
            --exclude-path node_modules --exclude-path .lake '**/*.md'

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.29.0"
          advanced-security: false
          annotations: true
          persona: pedantic
          min-severity: low
