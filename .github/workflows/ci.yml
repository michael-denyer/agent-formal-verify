name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install prek
        run: |
          python3 -m venv "$RUNNER_TEMP/prek"
          "$RUNNER_TEMP/prek/bin/pip" install -r .github/requirements.txt
      - name: Validate repository
        run: '"$RUNNER_TEMP/prek/bin/prek" run --all-files'

  skills-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes skills@1.5.23 add "$PWD/skills" --skill '*' --agent codex --yes --copy
      - run: diff -qr skills .agents/skills
